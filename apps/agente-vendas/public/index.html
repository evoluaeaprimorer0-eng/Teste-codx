<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agente de Vendas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Agente de Vendas</h1>
        <p>
          Simule uma conversa de qualificação para indicar o produto certo ao cliente.
        </p>
      </header>

      <section class="card">
        <label for="segmento">Segmento do cliente</label>
        <select id="segmento">
          <option value="">Selecione...</option>
          <option value="varejo">Varejo</option>
          <option value="servicos">Serviços</option>
          <option value="tecnologia">Tecnologia</option>
        </select>

        <label for="orcamento">Orçamento mensal (R$)</label>
        <input id="orcamento" type="number" min="0" step="100" placeholder="Ex.: 1500" />

        <button id="sugerir">Gerar sugestão</button>
        <p id="resultado" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
